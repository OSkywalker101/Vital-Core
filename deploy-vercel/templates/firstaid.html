{% extends "layout.html" %}
{% block content %}
<header class="bg-white/80 backdrop-blur-sm shadow-sm px-8 py-6">
    <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-3"><span>🧸</span> First Aid Guide</h1>
</header>
<div class="p-8">
    <div class="bg-red-100 border-2 border-red-300 rounded-xl p-4 mb-6 flex items-center gap-4">
        <span class="text-4xl">🚨</span>
        <div><p class="font-bold text-red-800">Serious Emergency?</p><p class="text-red-600">Call your local emergency number immediately!</p></div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
        <input type="text" id="searchInput" placeholder="Search topics..." oninput="filterTopics()"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-vc-blue focus:outline-none">
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6" id="topicsGrid">
        {% for t in topics %}
            <div class="card-h bg-gradient-to-br from-red-100 to-pink-50 rounded-2xl p-6 text-center cursor-pointer border-2 border-red-100" onclick="showTopic('{{ t.id }}')">
                <span class="text-5xl block mb-2">{{ t.icon }}</span>
                <h3 class="font-bold text-gray-800">{{ t.title }}</h3>
            </div>
        {% endfor %}
    </div>

    <div id="topicDetail" class="hidden bg-white rounded-2xl shadow-lg p-6 border-2 border-red-100">
        <button onclick="hideTopic()" class="float-right text-gray-400 hover:text-gray-600 text-2xl">✕</button>
        <div id="topicContent"></div>
    </div>
</div>

<script>
const topicsData = {{ topics|tojson }};
function filterTopics(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#topicsGrid > div').forEach((card,i)=>{
        card.style.display=(!q||topicsData[i].title.toLowerCase().includes(q))?'block':'none';
    });
}
function showTopic(id){
    const t=topicsData.find(x=>x.id===id);
    if(!t)return;
    document.getElementById('topicDetail').classList.remove('hidden');
    document.getElementById('topicContent').innerHTML=`
        <div class="bg-gradient-to-r from-red-400 to-pink-500 rounded-xl p-6 text-white mb-6">
            <span class="text-5xl block mb-2">${t.icon}</span>
            <h2 class="text-2xl font-bold">${t.title} First Aid</h2>
        </div>
        <h3 class="font-bold text-gray-800 mb-3">📋 What to Do:</h3>
        <ol class="space-y-2 mb-6">${t.steps.map((s,i)=>`<li class="flex gap-3 p-3 bg-gray-50 rounded-lg"><span class="flex-shrink-0 w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold">${i+1}</span><span class="text-gray-700">${s}</span></li>`).join('')}</ol>
        <div class="bg-red-50 border border-red-200 rounded-xl p-4"><h4 class="font-bold text-red-700 mb-2">⚠️ Warnings:</h4><ul class="space-y-1">${t.warnings.map(w=>`<li class="text-red-600 text-sm">${w}</li>`).join('')}</ul></div>
    `;
    window.scrollTo({top:200,behavior:'smooth'});
}
function hideTopic(){document.getElementById('topicDetail').classList.add('hidden');}
</script>
{% endblock %}
