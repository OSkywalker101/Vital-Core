{% extends "layout.html" %}
{% block content %}
<header class="bg-white/80 backdrop-blur-sm shadow-sm px-8 py-6">
    <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-3"><span>💧</span> Water Tracker</h1>
</header>
<div class="p-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-lg p-8 border-2 border-blue-200 text-center">
            <div class="relative w-48 h-48 mx-auto mb-6">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="96" cy="96" r="88" stroke="#e5e7eb" stroke-width="12" fill="none"/>
                    <circle cx="96" cy="96" r="88" stroke="#5DADE2" stroke-width="12" fill="none"
                        stroke-dasharray="553.14" stroke-dashoffset="{{ 553.14 - (553.14 * pct / 100) }}" stroke-linecap="round"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-3xl font-extrabold text-blue-500">{{ water }}ml</span>
                    <span class="text-sm text-gray-500">of 2000ml</span>
                </div>
            </div>
            <p class="text-2xl font-bold text-gray-800 mb-2">{{ glasses }} / 10 glasses</p>
            {% if pct >= 100 %}
                <p class="text-green-500 font-bold mb-4">🎉 Goal achieved!</p>
            {% elif pct >= 50 %}
                <p class="text-blue-500 font-bold mb-4">💪 Keep going!</p>
            {% endif %}
            <form action="/water/add" method="POST" class="mb-3">
                <button type="submit" class="w-full bg-gradient-to-r from-blue-400 to-blue-500 text-white font-bold py-3 px-6 rounded-xl hover:shadow-lg transition transform hover:scale-105">+ Add 200ml 💧</button>
            </form>
            <form action="/water/reset" method="POST">
                <button type="submit" class="w-full bg-gray-200 text-gray-600 font-semibold py-2 px-6 rounded-xl hover:bg-gray-300 transition">🔄 Reset</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
