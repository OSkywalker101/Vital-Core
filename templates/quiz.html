<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Medical Terminology Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Nunito',sans-serif;min-height:100vh;background:linear-gradient(135deg,#e3f2fd,#f5f5f5)}
        .flashcard{width:100%;height:280px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
        .flashcard.flipped{transform:rotateY(180deg)}
        .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
        .card-front{background:linear-gradient(135deg,#1976d2,#1565c0);color:white}
        .card-back{background:white;transform:rotateY(180deg);border:3px solid #e3f2fd}
        .choice-btn{background:white;border:2px solid #e0e0e0;padding:1rem 1.5rem;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;width:100%}
        .choice-btn:hover{border-color:#1565c0;background:#f5f5f5}
        .choice-btn.correct{background:#c8e6c9;border-color:#4caf50;color:#2e7d32}
        .choice-btn.wrong{background:#ffcdd2;border-color:#f44336;color:#c62828}
        .choice-btn:disabled{cursor:not-allowed}
    </style>
</head>
<body>
<div class="max-w-2xl mx-auto p-8">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-extrabold text-blue-800">📝 Medical Terminology Quiz</h1>
        <p class="text-gray-600">Learn medical prefixes, suffixes, and roots</p>
    </header>

    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <div class="font-bold text-blue-600">Score: <span id="score">0/0</span></div>
            <span class="text-sm text-gray-500"><span id="progress">1</span>/{{ terms|length }}</span>
        </div>

        <div class="flashcard-container mb-4" id="flashcardView">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="text-sm uppercase tracking-wider opacity-80 mb-2" id="cardType">Prefix</div>
                    <div class="text-4xl font-extrabold" id="cardTerm">Cardio-</div>
                </div>
                <div class="card-face card-back">
                    <div class="text-sm uppercase tracking-wider text-gray-400 mb-2" id="cardTypeBack">Prefix</div>
                    <div class="text-2xl font-bold text-blue-600 mb-2" id="cardMeaning">Heart</div>
                    <div class="text-sm text-gray-500" id="cardExample">Cardiology = Study of the heart</div>
                </div>
            </div>
            <p class="text-center text-sm text-gray-400 mt-2">Click to flip</p>
        </div>

        <div class="grid gap-3" id="quizView" style="display:none">
            <div class="text-center py-4 bg-blue-50 rounded-xl mb-2">
                <p class="text-sm text-gray-500">What does this mean?</p>
                <p class="text-2xl font-bold text-blue-600" id="quizTerm">Cardio-</p>
            </div>
            <div id="choices"></div>
            <div id="feedback" class="text-center py-2 rounded-xl font-bold" style="display:none"></div>
        </div>

        <div class="flex justify-center gap-4 mt-4">
            <button class="bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-full hover:bg-gray-300 transition" onclick="prevCard()">← Prev</button>
            <button class="bg-blue-600 text-white font-bold py-2 px-6 rounded-full hover:bg-blue-700 transition" onclick="nextCard()">Next →</button>
        </div>
        <div class="flex justify-center mt-4">
            <button class="text-sm text-blue-600 underline" onclick="toggleMode()">Switch to Quiz Mode</button>
        </div>
    </div>
</div>

<script>
const terms = {{ terms|tojson }};
let idx=0,correct=0,total=0,quizMode=false,answered=false;
function flipCard(){document.getElementById('flashcard').classList.toggle('flipped')}
function updateCard(){
    const t=terms[idx];
    document.getElementById('cardTerm').textContent=t.term;
    document.getElementById('cardType').textContent=t.type;
    document.getElementById('cardTypeBack').textContent=t.type;
    document.getElementById('cardMeaning').textContent=t.meaning;
    document.getElementById('cardExample').textContent=t.example;
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('progress').textContent=idx+1;
    if(quizMode)updateQuiz();
}
function updateQuiz(){
    const t=terms[idx];
    document.getElementById('quizTerm').textContent=t.term;
    const ci=Math.floor(Math.random()*4);
    const wrong=terms.filter(x=>x.meaning!==t.meaning).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning);
    const choices=[...wrong];choices.splice(ci,0,t.meaning);
    document.getElementById('choices').innerHTML=choices.map((c,i)=>`<button class="choice-btn" onclick="selectChoice(${i},'${c}')">${c}</button>`).join('');
    document.getElementById('feedback').style.display='none';
    answered=false;
}
function selectChoice(i,sel){
    if(answered)return;
    answered=true;total++;
    const t=terms[idx],btns=document.querySelectorAll('.choice-btn'),fb=document.getElementById('feedback');
    btns.forEach(b=>{b.disabled=true;if(b.textContent===t.meaning)b.classList.add('correct')});
    if(sel===t.meaning){correct++;fb.textContent='✓ Correct!';fb.className='text-center py-2 rounded-xl font-bold bg-green-100 text-green-700'}
    else{btns[i].classList.add('wrong');fb.textContent=`✗ Answer: ${t.meaning}`;fb.className='text-center py-2 rounded-xl font-bold bg-red-100 text-red-700'}
    fb.style.display='block';
    document.getElementById('score').textContent=`${correct}/${total}`;
}
function prevCard(){idx=(idx-1+terms.length)%terms.length;updateCard()}
function nextCard(){idx=(idx+1)%terms.length;updateCard()}
function toggleMode(){
    quizMode=!quizMode;
    document.getElementById('flashcardView').style.display=quizMode?'none':'block';
    document.getElementById('quizView').style.display=quizMode?'block':'none';
    if(quizMode)updateQuiz();
}
updateCard();
</script>
</body>
</html>
